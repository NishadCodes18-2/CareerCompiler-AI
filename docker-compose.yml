version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: careercompiler_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-careercompiler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careercompiler_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-careercompiler_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careercompiler} -d ${POSTGRES_DB:-careercompiler_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: careercompiler_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careercompiler_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://careercompiler:careercompiler_secret_2026@db:5432/careercompiler_ai
      SECRET_KEY: ${SECRET_KEY:-careercompiler-super-secret-key-2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careercompiler_frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  backend_storage:
