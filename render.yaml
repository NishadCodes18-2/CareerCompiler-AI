services:
  - type: web
    name: careercompiler-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careercompiler-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: careercompiler-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    rootDir: frontend
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: careercompiler-backend
          type: web
          property: host

databases:
  - name: careercompiler-db
    databaseName: careercompiler_ai
    user: careercompiler
    plan: free
